services:
  app:
    image: cgr.dev/chainguard/laravel:latest-dev
    restart: unless-stopped
    environment:
      UID: 789401116
      GID: 789400513
    working_dir: /app
    command: ["php-fpm", "-F"]
    volumes:
      - .:/app

  nginx:
    image: cgr.dev/chainguard/nginx
    restart: unless-stopped
    environment:
      UID: 789401116
      GID: 789400513
    ports:
      - 8000:80
    volumes:
      - .:/app
      - ./docker/dev/nginx.conf:/etc/nginx/nginx.conf

  mariadb:
    image: cgr.dev/chainguard/mariadb
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
      MARIADB_USER: sge
      MARIADB_PASSWORD: sge
      MARIADB_DATABASE: sge
    ports:
      - 3306:3306
