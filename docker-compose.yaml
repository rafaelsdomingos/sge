services:
  nginx:
    image: cgr.dev/chainguard/nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - 8000:80
    volumes:
      - .:/app
      - ./docker/dev/nginx.conf:/etc/nginx/nginx.conf

  app:
    image: cgr.dev/chainguard/laravel:latest-dev
    restart: unless-stopped
    user: "789401116:789400513"
    depends_on:
      - mysql
    working_dir: /app
    command: ["php-fpm", "-F"]
    volumes:
      - .:/app

  node:
    image: node:22
    working_dir: /app
    user: "789401116:789400513"
    environment:
      HOME: /tmp
    command: sh -c "npm install && npm run dev"
    ports:
      - 5173:5173
    volumes:
      - .:/app
      
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: sge
      MYSQL_USER: sge
      MYSQL_PASSWORD: sge
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
